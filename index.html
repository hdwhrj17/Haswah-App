<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1D63DC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Haswah">
<title>Haswah</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== DESIGN TOKENS: CLEAN CORPORATE SAAS LIGHT & DARK MODE ===== */
:root{
  --bg:#FFFFFF;--sf:#F4F7FC;--sf2:#EBF3FF;--card:#FFFFFF;
  --sb:#1D63DC;--sb2:#154BB0;--ac:#1D63DC;--ac2:#2563EB;--hl:#EBF3FF;
  --tx:#1E293B;--tx2:#475569;--mu:#94A3B8;--bd:#E2E8F0;
  --ok:#16A34A;--okb:#DCFCE7;--okt:#15803D;
  --wn:#F59E0B;--wnb:#FEF3C7;--wnt:#B45309;
  --er:#DC2626;--erb:#FEE2E2;--ert:#B91C1C;
  --in:#1D63DC;--inb:#DBEAFE;--int:#1D4ED8;
  --sh:0 4px 20px rgba(15,23,42,.05);
}
#app.dark{
  --bg:#0B1120;--sf:#131C31;--sf2:#1A2642;--card:#131C31;
  --sb:#172554;--sb2:#1E3A8A;--ac:#3B82F6;--ac2:#60A5FA;--hl:rgba(59,130,246,.16);
  --tx:#F1F5F9;--tx2:#CBD5E1;--mu:#94A3B8;--bd:#24324D;
  --ok:#34D399;--okb:rgba(52,211,153,.16);--okt:#6EE7B7;
  --wn:#FBBF24;--wnb:rgba(251,191,36,.16);--wnt:#FCD34D;
  --er:#F87171;--erb:rgba(248,113,113,.18);--ert:#FCA5A5;
  --in:#60A5FA;--inb:rgba(96,165,250,.18);--int:#93C5FD;
  --sh:0 6px 24px rgba(0,0,0,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;z-index:2147483000;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;font:14px/1.45 'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--tx);transition:background .2s,color .2s}
#app button,#app input,#app select,#app textarea{font:inherit}
.ic{flex:none;vertical-align:middle}

/* ===== DESKTOP CURVED SIDEBAR (COLLAPSIBLE) ===== */
.side{position:fixed;left:0;top:0;bottom:0;width:260px;display:none;flex-direction:column;background:var(--bg);z-index:10;transition:width .22s cubic-bezier(.4,0,.2,1),background .2s}
.sbrand{height:74px;padding:0 14px 0 20px;display:flex;align-items:center;gap:10px;background:var(--bg);position:relative}
.sbrand img{width:38px;height:38px;border-radius:11px;object-fit:cover;box-shadow:0 2px 8px rgba(29,99,220,.22);flex:none}
.sbrand span{font-size:18px;font-weight:700;color:var(--ac);letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.stog{width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--ac);display:inline-grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.12);transition:all .15s;flex:none}
.stog:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.sbody{flex:1;background:linear-gradient(180deg,var(--sb),var(--sb2));border-top-right-radius:44px;padding:24px 16px 18px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;overflow-x:hidden;color:#fff;box-shadow:4px 0 24px rgba(29,99,220,.14);transition:padding .22s,border-radius .22s}
.cta{background:#FFFFFF;color:#1D63DC;border:0;border-radius:999px;padding:12px 18px;font-weight:600;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.14);margin-bottom:16px;transition:all .15s;white-space:nowrap}
.cta:active{transform:scale(.97)}
.nv{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;border:0;background:none;color:rgba(255,255,255,.82);cursor:pointer;text-align:left;width:100%;font-size:13.5px;font-weight:500;transition:all .15s;white-space:nowrap;position:relative}
.nv:hover{background:rgba(255,255,255,.1);color:#fff}
.nv.on{background:rgba(255,255,255,.22);color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sfoot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.18);font-size:12px;white-space:nowrap;overflow:hidden}
.sfoot .spg{height:5px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin:7px 0 5px}
.sfoot .spg i{display:block;height:100%;background:#fff;border-radius:99px}
.dtog{display:none}

/* ===== TOP HEADER BAR & MAIN CONTAINER ===== */
.main{padding:0 16px calc(122px + env(safe-area-inset-bottom,0px));min-height:100%;min-width:0;max-width:100%;transition:margin-left .22s cubic-bezier(.4,0,.2,1)}
.top{position:sticky;top:0;z-index:8;background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 16px;margin:0 -16px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:background .2s,border-color .2s}
.mbrand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;color:var(--ac);min-width:0}
.mbrand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbrand img{width:32px;height:32px;border-radius:9px;flex:none}
.tsrch{flex:1;max-width:420px;position:relative;display:none}
.tsrch svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mu)}
#app .tsrch input{padding:9px 16px 9px 42px;border-radius:999px;background:var(--sf);border:1px solid transparent;font-size:13px}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--sf);color:var(--tx);display:inline-grid;place-items:center;cursor:pointer;position:relative;flex:none;transition:all .15s}
.ibtn:hover{border-color:var(--ac);color:var(--ac)}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:#EF4444;border:1.5px solid var(--bg)}
.dot.ok{background:#16A34A}
.upill{display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 4px 3px 10px;border-radius:999px;border:1px solid var(--bd);background:var(--sf);min-width:0}
.upill span{font-size:12.5px;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.ptitle{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.ptitle h1{margin:0;font-size:22px;font-weight:700;color:var(--ac);display:flex;align-items:center;gap:10px}
.ptitle small{display:block;color:var(--mu);font-size:12.5px}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);margin:16px 0 10px}

/* ===== MOBILE GLASSMORPHIC BOTTOM NAV ===== */
.bn{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:22px;box-shadow:0 8px 28px rgba(15,23,42,.15);padding:6px;z-index:20}
.bn::-webkit-scrollbar{display:none}
#app.dark .bn{background:rgba(19,28,49,.88)}
.bn button{flex:1 0 56px;border:0;background:none;border-radius:14px;padding:6px 2px;font-size:10px;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.bn .on{background:var(--ac);color:#fff;font-weight:600}

.kg{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.kg>div,.g>div,.card{min-width:0}
.kcart{position:relative}
.kbar{position:fixed;left:12px;right:12px;bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--ac);color:#fff;border:0;border-radius:16px;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 24px rgba(29,99,220,.35);cursor:pointer;font-weight:600;font-size:13.5px}
.kbar:active{transform:scale(.98)}
@media(min-width:768px){
  .side{display:flex;width:220px}.bn{display:none}.mbrand{display:none}.tsrch{display:block}.dtog{display:inline-grid}
  .main{margin-left:220px;padding:0 20px 84px}
  .top{margin:0 -20px 18px;padding:14px 20px;height:74px}
  .kbar{left:240px;right:20px;bottom:16px}
}
@media(min-width:1024px){
  .side{width:250px}
  .main{margin-left:250px;padding:0 24px 40px}
  .top{margin:0 -24px 20px;padding:14px 24px}
  .kg{grid-template-columns:minmax(0,1fr) 340px}
  .kcart{position:sticky;top:88px;max-height:calc(100vh - 104px);overflow-y:auto}
  .kbar{display:none}
}
@media(min-width:1240px){
  .side{width:260px}
  .main{margin-left:260px;padding:0 28px 40px}
  .top{margin:0 -28px 20px;padding:14px 28px}
  .kg{grid-template-columns:minmax(0,1fr) 370px}
}
@media(min-width:768px){
  #app.scol .side{width:78px}
  #app.scol .main{margin-left:78px}
  #app.scol .kbar{left:98px}
  #app.scol .sbrand{padding:0 8px;justify-content:center}
  #app.scol .sbrand span,#app.scol .cta span,#app.scol .nlbl,#app.scol .sfoot{display:none}
  #app.scol .sbrand .stog{position:absolute;right:-14px;top:23px;z-index:15}
  #app.scol .sbody{border-top-right-radius:28px;padding:20px 10px 14px;align-items:center}
  #app.scol .cta{width:46px;height:46px;padding:0;border-radius:14px;font-size:20px;margin-bottom:14px}
  #app.scol .nv{justify-content:center;padding:11px 0;width:48px;height:48px}
  #app.scol .nv .cc{position:absolute;top:2px;right:2px;padding:0 5px;font-size:9.5px;background:#EF4444;box-shadow:0 2px 4px rgba(0,0,0,.25)}
}
@media(max-width:480px){.upill span{display:none}.upill{padding:2px;border:0;background:none}.top{gap:6px}.top .row{gap:5px}.ibtn{width:34px;height:34px}.av{width:30px;height:30px;font-size:12px}}

/* ===== CARDS, QUICK ACCESS & CONTROLS ===== */
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh);transition:background .2s,border-color .2s}
.qa{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;position:relative;transition:transform .15s}
.qa.pri{background:linear-gradient(135deg,#1D63DC,#2563EB);color:#fff;border-color:transparent;box-shadow:0 10px 24px rgba(29,99,220,.26)}
.qa.pri .mu{color:rgba(255,255,255,.85)}
.qa.pri .qic{background:rgba(255,255,255,.22);color:#fff}
.qic{width:38px;height:38px;border-radius:12px;background:var(--hl);color:var(--ac);display:grid;place-items:center;margin-bottom:10px}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
@media(max-width:340px){.g2{grid-template-columns:1fr}}
.btn{background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .14s}
.btn:active,.ad:active{transform:scale(.96)}
.btn.a{background:var(--ac);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(29,99,220,.22)}
.btn.o{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.btn.s{padding:6px 12px;font-size:12px;border-radius:10px}
.btn.d{background:var(--er);color:#fff;border-color:transparent}
.btn.w{width:100%}
.ad{background:var(--ac);color:#fff;border:0;border-radius:11px;width:36px;height:36px;font-size:20px;font-weight:600;cursor:pointer;display:inline-grid;place-items:center;flex:none}

#app input,#app select,#app textarea{width:100%;max-width:100%;min-width:0;background:var(--sf);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:10px 14px;outline:0;transition:border-color .15s,background .15s}
#app input:focus,#app select:focus{border-color:var(--ac);background:var(--card)}
#app select option{color:#1E293B;background:#fff}
#app input[type=checkbox]{accent-color:var(--ac)}
#app label{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px;font-weight:500}

.srch{position:relative;max-width:100%}.srch svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mu)}#app .srch input{padding-left:42px;border-radius:999px}
.chips{display:flex;gap:8px;align-items:center;overflow-x:auto;max-width:100%;margin:12px 0;padding-bottom:2px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:6px 16px;cursor:pointer;white-space:nowrap;font-size:12.5px;font-weight:500;color:var(--tx2);flex:none}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}

.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:12px}.b{font-weight:600}.r{text-align:right}
.bd{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.ok{background:var(--okb);color:var(--okt)}.wn{background:var(--wnb);color:var(--wnt)}.er{background:var(--erb);color:var(--ert)}.in{background:var(--inb);color:var(--int)}
.pg{height:6px;border-radius:9px;background:var(--bd);overflow:hidden;margin:4px 0}.pg i{display:block;height:100%;transition:width .3s}
.ln{padding:11px 6px;border-bottom:1px solid var(--bd);border-radius:8px;transition:background .12s}.ln:last-child{border-bottom:0}.ln:hover{background:var(--hl)}

.md{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.md>div{background:var(--card);border:1px solid var(--bd);color:var(--tx);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px;box-shadow:0 -10px 32px rgba(0,0,0,.22)}
@media(min-width:768px){.md{align-items:center}.md>div{border-radius:24px}}

.tg{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;font-weight:600;padding:10px 20px;border-radius:12px;z-index:200;box-shadow:0 8px 24px rgba(29,99,220,.35);max-width:90vw;text-align:center;font-size:13px}
.st{display:flex;flex-direction:column;align-items:center;background:var(--ac);color:#fff;border-radius:999px;padding:2px 0;font-weight:700;min-width:30px;flex:none}.st button{background:none;border:0;color:#fff;font-size:16px;width:28px;height:24px;cursor:pointer}
.em{text-align:center;color:var(--mu);padding:28px 10px;font-size:13px}

table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}th{color:var(--mu);font-weight:600;font-size:11.5px;text-transform:uppercase}tbody tr:hover{background:var(--hl)}.ov{overflow-x:auto}

/* ===== LOGIN SCREEN ===== */
.lg{min-height:100%;display:flex;flex-direction:column;background:var(--sf)}
.lh{background:linear-gradient(145deg,#1D63DC,#154BB0);color:#fff;text-align:center;padding:34px 20px 44px;border-radius:0 0 36px 36px;position:relative;overflow:hidden}
.lh img{width:110px;border-radius:24px;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.lt{opacity:.9;max-width:380px;margin:8px auto 0;font-size:13.5px}.lf{display:none}
.lr{flex:1;display:flex;padding:20px}.lc{width:100%;max-width:420px;margin:auto;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:24px;box-shadow:var(--sh)}
@media(min-width:900px){
  .lg{flex-direction:row;position:absolute;inset:0}
  .lh{flex:1.1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;border-radius:0 56px 56px 0;padding:60px 64px}
  .lh img{width:136px}.lh h2{font-size:40px;margin:20px 0 6px;line-height:1.15}
  .lt{font-size:15px;margin:0 0 28px;max-width:460px}
  .lf{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;max-width:520px}
}
.tab{display:flex;background:var(--sf);border:1px solid var(--bd);border-radius:999px;padding:4px;gap:4px}
.tab button{flex:1;border:0;background:none;border-radius:999px;padding:8px;cursor:pointer;color:var(--tx2);font-weight:500;font-size:13px}.tab .on{background:var(--ac);color:#fff;font-weight:600}
.th{background:var(--sf);color:var(--ac);border-radius:14px;width:100%;height:132px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;overflow:hidden;position:relative;padding:4px}
.th.hi{background:#fff;border:1px solid var(--bd);cursor:zoom-in}
.th img{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:10px}
.ib{padding:4px}.ib img{object-fit:contain}
.ptag{position:absolute;top:6px;right:6px;background:var(--ac);color:#fff;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px}
.big{font-size:26px;font-weight:700;color:var(--ac)}
.cc{background:rgba(255,255,255,.25);color:#fff;border-radius:99px;padding:1px 7px;font-size:10.5px;font-weight:700;margin-left:auto}.cc:empty{display:none}
.bn .cc{position:absolute;top:3px;right:8px;background:var(--ac);color:#fff;padding:0 5px;font-size:9.5px}
.trk{display:flex;margin:12px 0}.trk div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.trk i{display:block;width:12px;height:12px;border-radius:50%;background:var(--bd);margin:0 auto 4px}.trk .on{color:var(--ac);font-weight:600}.trk .on i{background:var(--ac)}
.lk{background:none;border:0;color:var(--ac);font-weight:600;cursor:pointer;padding:4px 0;font-size:12.5px}
#rcp{background:#fff;color:#111;padding:14px;border-radius:14px}
@media print{#app{zoom:1!important}#root,.tg,.noprint,.top,.side,.bn{display:none!important}#app{position:static;overflow:visible;background:#fff}.md{position:static;background:none;display:block;backdrop-filter:none}.md>div{box-shadow:none;max-height:none;padding:0;max-width:none;border-radius:0;background:#fff!important;border:0}#rcp{padding:0;border-radius:0}@page{margin:4mm}}
</style>
</head>
<body>
<div id="app"><div id="root"></div><div id="md"></div></div>

<script type="module">
// ============================================================================
// 1. KONFIGURASI SAKLAR PREVIEW & FIREBASE CONFIG
// ============================================================================
const IS_PREVIEW = false; // Ubah menjadi false SAAT DEPLOY / PUBLISH agar terhubung murni ke Firebase tanpa data dummy

// PASTE FIREBASE CONFIG ANDA DI SINI
const firebaseConfig = {

  projectId: "haswah",
  storageBucket: "haswah.firebasestorage.app",
  messagingSenderId: "335381514851",

async function rm(c,id){if(IS_PREVIEW){S[c]=S[c].filter(x=>x.id!==id);return}await F.deleteDoc(F.doc(db,c,id))}

async function awardPoints(custId,delta,refId,ket){
  if(!custId||!delta)return;
  if(IS_PREVIEW){const c=S.customers.find(x=>x.id===custId);if(c)c.poin=Math.max(0,(c.poin||0)+delta);S.point_history.unshift({id:uid(),memberId:c?.memberId||custId,username:custId,tipe:delta>0?'dapat':'tukar',poin:delta,keterangan:ket,refId,waktu:Date.now()});return}

let seenWait=new Set(),waitInit=false,seenLow=new Set(),lowInit=false,orderSt={},custInit=false;
function syncBadges(){
  const qn=qc();
  document.querySelectorAll('.qbadge').forEach(e=>e.textContent=qn||'');
  const bdot=$('bdot');if(bdot){const nGranted='Notification' in window&&Notification.permission==='granted';bdot.className='dot'+(!nGranted||qn?'':' ok')}
  try{if(me&&me.role!=='cust'){if(qn>0&&navigator.setAppBadge)navigator.setAppBadge(qn);else if(navigator.clearAppBadge)navigator.clearAppBadge()}}catch(e){}
}
function listen(){if(IS_PREVIEW)return;seenWait=new Set();waitInit=false;seenLow=new Set();lowInit=false;orderSt={};custInit=false;
  const cols=me.role==='cust'?['products','settings','orders','point_history']:['ingredients','products','transactions','settings','orders','customers','point_history'].concat(me.role==='admin'?['stock_movements','users']:[]);
  cols.forEach(c=>{
    let ref;
    if(['transactions','stock_movements','orders','point_history'].includes(c))ref=F.query(F.collection(db,c),F.orderBy('waktu','desc'),F.limit({orders:200,stock_movements:2000}[c]||500));
    else ref=F.collection(db,c);
    un.push(F.onSnapshot(ref,s=>{
      if(c==='settings'){const d=s.docs.find(x=>x.id==='shop');if(d)S.settings={...S.settings,...d.data()}}
      else S[c]=s.docs.map(d=>({id:d.id,...d.data()}));
      if(c==='orders'&&me){
        if(me.role!=='cust'){
          const waiting=S.orders.filter(o=>o.status==='menunggu'&&day(o.waktu)===today());
          if(!waitInit){waiting.forEach(o=>seenWait.add(o.id));waitInit=true}
          else{
            const added=waiting.filter(o=>!seenWait.has(o.id));
            seenWait=new Set(waiting.map(o=>o.id));
            if(added.length===1){const o=added[0];sysNotif('Pesanan Baru '+o.noAntrian,`${o.nama} memesan ${o.items.reduce((a,i)=>a+i.qty,0)} item (${R(o.total)})`,'antri')}
            else if(added.length>1){sysNotif('Pesanan Baru',`Ada ${added.length} pesanan baru menunggu konfirmasi!`,'antri')}
          }
          syncBadges();
        }else{
          if(!custInit){S.orders.filter(o=>isMine(o)&&day(o.waktu)===today()).forEach(o=>orderSt[o.id]=o.status);custInit=true}
          else{S.orders.filter(o=>isMine(o)&&day(o.waktu)===today()).forEach(o=>{const prev=orderSt[o.id];if(prev&&prev!==o.status&&['diproses','siap','selesai'].includes(o.status))sysNotif('Update Pesanan '+o.noAntrian,'Status pesanan Anda: '+ST[o.status][0],'cqueue');orderSt[o.id]=o.status})}
        }
      }
      if(c==='ingredients'&&me&&me.role!=='cust'&&S.settings.notifStok!==false){
        const lowIds=S.ingredients.filter(i=>i.stok<=i.stokMinimum);
        if(!lowInit){lowIds.forEach(i=>seenLow.add(i.id));lowInit=true}
        else{
          const newlyLow=lowIds.filter(i=>!seenLow.has(i.id));
          seenLow=new Set(lowIds.map(i=>i.id));
          if(newlyLow.length)sysNotif('Stok Bahan Menipis',`${newlyLow[0].nama} tersisa ${+newlyLow[0].stok.toFixed(1)} ${newlyLow[0].satuan}`,'stock');
        }
      }
      if(page!=='set'&&page!=='cprof')view()
    },e=>{if(c!=='customers')toast('Gagal memuat '+c+': '+fe(e))}))
  });
  if(me.role==='cust'&&me.id){
    un.push(F.onSnapshot(F.doc(db,'customers',me.id),d=>{if(d.exists()){const x=d.data();me.nama=x.nama;me.poin=x.poin||0;me.noWa=x.noWa||'';me.memberId=x.memberId||me.id;const i=S.customers.findIndex(k=>k.id===me.id);if(i>=0)S.customers[i]={id:me.id,...x};else S.customers.push({id:me.id,...x});if(page!=='cprof')view()}}))
  }}

const P={
dash(){const t=done().filter(x=>day(x.waktu)===today()),top={};t.forEach(x=>x.items.forEach(i=>top[i.nama]=(top[i.nama]||0)+i.qty));
  const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5),low=S.ingredients.filter(i=>i.stok<=i.stokMinimum);
  const cards=[['Omzet Hari Ini',R(sum(t,'total')),'rep',1],['Laba Kotor',R(sum(t,'laba')),'card',0],['Transaksi Hari Ini',t.length+' Order','kasir',0],['Stok Menipis',low.length+' Bahan','box',0]];
  return head('Dashboard','Ringkasan performa usaha hari ini')+`
  <div class="sec">Quick Access</div>
  <div class="g g4">${cards.map(c=>`<div class="qa ${c[3]?'pri':''}"><i class="qic">${ic(c[2],19)}</i><div class="mu">${c[0]}</div><div class="b" style="font-size:19px;margin-top:2px">${c[1]}</div></div>`).join('')}</div>
  <div class="sec">Ringkasan Operasional</div>
  <div class="g g3"><div class="card"><div class="b" style="margin-bottom:8px">Produk Terlaris Hari Ini</div>${tp.length?tp.map(x=>`<div class="ln row sp"><span>${esc(x[0])}</span><span class="bd in">${x[1]}x</span></div>`).join(''):em('Belum ada penjualan hari ini')}</div>
  <div class="card"><div class="b" style="margin-bottom:8px">Peringatan Stok Bahan</div>${low.length?low.map(i=>`<div class="ln row sp"><span>${esc(i.nama)}</span><span class="bd ${st(i)[1]}">${+i.stok.toFixed(1)} ${i.satuan}</span></div>`).join(''):em('Semua stok bahan aman')}</div>
  <div class="card"><div class="b" style="margin-bottom:8px">Antrian Pesanan Aktif</div>${act().length?act().slice(0,5).map(o=>`<div class="ln row sp"><span><b>${o.noAntrian}</b> &#183; ${esc(o.nama)}</span><span class="bd ${ST[o.status][1]}">${ST[o.status][0]}</span></div>`).join(''):em('Tidak ada antrian aktif')}</div></div>`},

kasir(){const cs=['Semua',...new Set(S.products.map(p=>p.kategori))];

prod(){const tm=S.settings.targetMarginPersen||60;

stock(){const ad=me.role==='admin';

masuk(){const f=mf,l=S.stock_movements.filter(m=>(f.t==='semua'||m.tipe===f.t)&&(!f.v||day(m.waktu).startsWith(f.v))),inn=l.filter(m=>m.tipe==='masuk'),bm={};

  sel=(fn,v,o)=>`<select style="flex:1;min-width:130px" onchange="${fn}(this.value)">${o.map(x=>`<option value="${x[0]}" ${v===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`;
  return head('Stok Masuk & Opname','Pencatatan pembelian bahan dan penyesuaian fisik')+`<div class="row" style="flex-wrap:wrap"><button class="btn a" onclick="A.sf()">+ Stok Masuk</button><button class="btn o" onclick="A.of()">Opname Stok</button></div>
  <div class="card" style="margin-top:14px"><div class="b">Filter Periode</div><div class="row" style="flex-wrap:wrap;margin-top:8px">${sel('A.mfm',f.m,[['hari','Per Tanggal'],['bulan','Per Bulan'],['tahun','Per Tahun'],['semua','Semua Waktu']])}${vin?`<div style="flex:1;min-width:150px">${vin}</div>`:''}${sel('A.mft',f.t,[['masuk','Stok Masuk'],['penyesuaian','Opname'],['penjualan','Penjualan'],['batal','Pembatalan'],['semua','Semua Tipe']])}</div></div>
  <div class="g g3" style="margin-top:14px">${[['Kali Stok Masuk',inn.length],['Total Pembelian',R(sum(inn,'totalHarga'))],['Jumlah Catatan',l.length]].map(c=>`<div class="qa"><div class="mu">${c[0]}</div><div class="b" style="font-size:18px;margin-top:4px">${c[1]}</div></div>`).join('')}</div>
  ${Object.keys(bm).length?`<div class="card ov" style="margin-top:14px"><div class="b" style="margin-bottom:8px">Ringkasan Stok Masuk per Bahan</div>${tbl(['Bahan','Qty Masuk','Total Pembelian'],Object.entries(bm).map(e=>[ig(e[0])?.nama||'-',+e[1].q.toFixed(1)+' '+(ig(e[0])?.satuan||''),R(e[1].h)]),[1,2])}</div>`:''}
  <div class="card" style="margin-top:14px"><div class="b" style="margin-bottom:8px">Riwayat Pergerakan Stok</div>${l.length?`<div class="ov"><table><thead><tr><th>Waktu</th><th>Bahan</th><th>Tipe</th><th class="r">Qty</th><th class="r">Harga</th><th class="r">Aksi</th></tr></thead><tbody>${l.slice(0,200).map(m=>`<tr><td>${new Date(m.waktu).toLocaleString('id-ID')}</td><td>${esc(ig(m.bahanId)?.nama||'-')}</td><td><span class="bd ${m.tipe==='masuk'?'ok':m.tipe==='penyesuaian'?'in':m.tipe==='batal'?'wn':'er'}">${esc(m.tipe)}</span></td><td class="r">${m.qty>0?'+':''}${+m.qty.toFixed(1)} ${esc(ig(m.bahanId)?.satuan||'')}</td><td class="r">${m.totalHarga?R(m.totalHarga):'-'}</td><td class="r"><div class="row" style="justify-content:flex-end;gap:6px"><button class="btn s o" onclick="A.mve('${m.id}')">Edit</button><button class="btn s d" onclick="A.mvd('${m.id}')">Hapus</button></div></td></tr>`).join('')}</tbody></table></div>`:em('Tidak ada data pada periode ini')}</div>`},

hist(){const l=S.transactions.filter(t=>day(t.waktu)===today());

set(){const s=S.settings,g=k=>(pend[k]??s[k])||'',nGranted='Notification' in window&&Notification.permission==='granted';return head('Pengaturan Usaha','Konfigurasi toko, notifikasi HP real-time, poin, WhatsApp, dan printer')+`<div class="card" style="max-width:540px"><label>Nama usaha</label><input id="f1" value="${esc(s.namaUsaha)}"><label>Alamat</label><input id="f2" value="${esc(s.alamat)}"><label>Pajak (%)</label><input id="f3" type="number" min="0" max="100" step="any" value="${s.pajakPersen||0}"><label>Target margin (%)</label><input id="f4" type="number" min="0" max="95" value="${s.targetMarginPersen||60}">
  <div class="b" style="margin-top:18px;color:var(--ac)">Notifikasi Real-Time & Aplikasi HP</div>
  <div class="card" style="margin-top:8px;background:var(--sf)"><div class="row sp" style="flex-wrap:wrap"><div><div class="b">Notifikasi Browser / PWA HP</div><div class="mu">${nGranted?'Aktif (berbunyi & pop-up saat pesanan masuk)':'Belum aktif di perangkat ini'}</div></div><button class="btn s a" onclick="A.notifPerm()">${nGranted?'Tes Notif':'Aktifkan'}</button></div><div class="row sp" style="flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)"><div><div class="b">Pasang Aplikasi di Beranda HP</div><div class="mu">${isStandalone()?'Sudah dibuka dari beranda HP':'Akses cepat tanpa perlu buka link web'}</div></div>${isStandalone()?'<span class="bd ok">Terpasang</span>':`<button class="btn s o" onclick="A.installApp()">${ic('phone',14)} Pasang</button>`}</div></div>
  <label>Push Layar Kunci HP (ntfy.sh - masuk HP meski browser ditutup)</label><select id="fn1"><option value="0" ${!s.ntfyAktif?'selected':''}>Nonaktif</option><option value="1" ${s.ntfyAktif?'selected':''}>Aktif</option></select>
  <label>Topic Rahasia ntfy</label><div class="row"><input id="fn2" value="${esc(s.ntfyTopic||'')}" placeholder="Contoh: haswah-toko-8472" style="flex:1"><button class="btn s o" onclick="A.genNtfy()">Buat Acak</button><button class="btn s a" onclick="A.testNtfy()">Tes</button></div><div class="mu" style="margin-top:4px">Install app <b>ntfy</b> di HP (Play Store/App Store) lalu subscribe ke topic di atas untuk menerima notifikasi pesanan baru secara real-time di layar kunci HP.</div>
  <label>Kirim notifikasi WA otomatis ke Nomor WA Toko saat pesanan masuk (butuh Token Fonnte)</label><select id="fn3"><option value="0" ${!s.waNotifToko?'selected':''}>Tidak</option><option value="1" ${s.waNotifToko?'selected':''}>Ya</option></select>
  <label>Peringatan notifikasi saat stok bahan menipis</label><select id="fn4"><option value="1" ${s.notifStok!==false?'selected':''}>Aktif</option><option value="0" ${s.notifStok===false?'selected':''}>Nonaktif</option></select>
  <div class="b" style="margin-top:18px;color:var(--ac)">Program Poin Loyalty Pelanggan</div><label>Status program poin</label><select id="fp1"><option value="1" ${s.poinAktif!==false?'selected':''}>Aktif</option><option value="0" ${s.poinAktif===false?'selected':''}>Nonaktif</option></select><div class="row"><div style="flex:1"><label>Setiap kelipatan belanja (Rp)</label><input id="fp2" type="number" min="100" step="500" value="${s.poinNominal||10000}"></div><div style="flex:1"><label>Poin yang didapat</label><input id="fp3" type="number" min="1" value="${s.poinDapat||1}"></div></div>
  <div class="b" style="margin-top:18px;color:var(--ac)">Struk Bluetooth & Notifikasi WhatsApp</div><label>Nomor WhatsApp toko (penerima konfirmasi pembayaran QRIS/Transfer)</label><input id="f6" value="${esc(s.waToko||'')}" placeholder="628123456789"><label>Template pesan WA pesanan siap/selesai</label><input id="fw1" value="${esc(s.waPesanSiap||'Halo {nama}, pesanan {noAntrian} Anda di {toko} sudah {status}! Terima kasih telah memesan.{infoPoin}')}"><div class="mu" style="margin-top:3px">Variabel: {nama}, {noAntrian}, {toko}, {status}, {infoPoin}</div><label>Token API WhatsApp Gateway (Fonnte - Opsional, kosongkan jika pakai wa.me manual)</label><input id="fw2" value="${esc(s.waApiToken||'')}" placeholder="Opsional: token Fonnte"><label>Lebar kertas struk</label><select id="f7"><option value="80" ${+s.lebarStruk!==58?'selected':''}>80 mm</option><option value="58" ${+s.lebarStruk===58?'selected':''}>58 mm</option></select><label>Cetak struk otomatis setelah bayar (Printer Bluetooth)</label><select id="f8"><option value="0">Tidak</option><option value="2" ${s.autoCetak==='2'||s.autoCetak==='1'?'selected':''}>Ya (Langsung Printer Bluetooth)</option></select>

  <div class="b" style="margin-top:18px;color:var(--ac)">Pembayaran</div>${imgBox('qris',g('qris'),'Gambar QRIS')}<label>Info rekening transfer</label><input id="f5" value="${esc(s.infoTransfer||'')}" placeholder="Contoh: BCA 1234567890 a.n. Haswah">${imgBox('transfer',g('transfer'),'Gambar rekening / QR transfer (opsional)')}<button class="btn a w" style="margin-top:16px" onclick="A.ts()">Simpan Pengaturan</button></div>`+diagCard()+resetCard()}};

A.ts=async()=>{const s=S.settings,o={
  namaUsaha:$('f1').value.trim()||'Haswah',alamat:$('f2').value.trim(),pajakPersen:+$('f3').value||0,targetMarginPersen:Math.min(95,+$('f4').value||60),

const prep=(f,mx,cb)=>{if(!f)return;if(f.size>20e6)return toast('Ukuran gambar maksimal 20 MB');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.88))};im.onerror=()=>toast('File bukan gambar yang valid');im.src=r.result};r.readAsDataURL(f)};

const payBox=()=>{const s=S.settings,k=pay==='QRIS'?'qris':pay==='Transfer'?'transfer':'';if(!k)return'';
  const im=s[k]?`<div style="text-align:center;margin:8px 0"><img src="${s[k]}" alt="" style="width:100%;max-width:220px;border-radius:12px;border:1px solid var(--bd);cursor:zoom-in" onclick="A.qr('${k}')"><div class="mu">Ketuk gambar untuk memperbesar</div></div>`:'',inf=k==='transfer'&&s.infoTransfer?`<div class="card" style="margin:8px 0;background:var(--sf)">${esc(s.infoTransfer)}</div>`:'';

// ===== LAPORAN: DATA, CSV, PDF =====
const repData=()=>{const a=d1||today().slice(0,8)+'01',b=d2||today(),l=done().filter(t=>day(t.waktu)>=a&&day(t.waktu)<=b).sort((x,y)=>x.waktu-y.waktu),pm={},bm={},mm={};
  l.forEach(t=>{t.items.forEach(i=>{const x=pm[i.nama]||(pm[i.nama]={q:0,o:0,l:0});x.q+=i.qty;x.o+=i.harga*i.qty;x.l+=(i.harga-i.hpp)*i.qty});(t.pakai||[]).forEach(u=>bm[u.bahanId]=(bm[u.bahanId]||0)+u.qty);const m=mm[t.metode]||(mm[t.metode]={n:0,o:0});m.n++;m.o+=t.total});
  return{a,b,l,pm,bm,mm,om:sum(l,'total'),hp:sum(l,'totalHPP'),lb:sum(l,'laba'),dk:sum(l,'diskon'),pj:sum(l,'pajak')}};
const sm=d=>[['Omzet',R(d.om)],['Diskon',R(d.dk)],['Pajak',R(d.pj)],['Total HPP',R(d.hp)],['Laba kotor',R(d.lb)],['Jumlah transaksi',d.l.length]];
const tM=d=>Object.entries(d.mm).map(e=>[e[0],e[1].n,R(e[1].o)]),tP=d=>Object.entries(d.pm).map(e=>[e[0],e[1].q,R(e[1].o),R(e[1].l)]),tB=d=>Object.entries(d.bm).map(e=>[ig(e[0])?.nama||'-',+e[1].toFixed(1)+' '+(ig(e[0])?.satuan||'')]);
const tbl=(h,r,rt)=>r.length?`<table><thead><tr>${h.map((x,i)=>`<th class="${rt.includes(i)?'r':''}">${x}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map((c,i)=>`<td class="${rt.includes(i)?'r':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:em('Tidak ada data pada periode ini');
const dl=(blob,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
A.csv=()=>{const d=repData(),M=Math.round,cell=c=>{c=String(c??'');return/[";\r\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c},
  rs=[[(S.settings.namaUsaha||'Haswah')+' - Laporan Keuangan'],['Periode',d.a,d.b],[],['RINGKASAN'],['Omzet',M(d.om)],['Diskon',M(d.dk)],['Pajak',M(d.pj)],['Total HPP',M(d.hp)],['Laba kotor',M(d.lb)],['Jumlah transaksi',d.l.length],[],
  ['PER METODE PEMBAYARAN'],['Metode','Jumlah transaksi','Total'],...Object.entries(d.mm).map(e=>[e[0],e[1].n,M(e[1].o)]),[],
  ['PENJUALAN PER PRODUK'],['Produk','Qty','Omzet','Laba'],...Object.entries(d.pm).map(e=>[e[0],e[1].q,M(e[1].o),M(e[1].l)]),[],
  ['PEMAKAIAN BAHAN'],['Bahan','Terpakai','Satuan'],...Object.entries(d.bm).map(e=>[ig(e[0])?.nama||'-',+e[1].toFixed(2),ig(e[0])?.satuan||'']),[],
  ['DAFTAR TRANSAKSI'],['No Order','Waktu','Kasir','Metode','Subtotal','Diskon','Pajak','Total','HPP','Laba'],...d.l.map(t=>[t.noOrder,new Date(t.waktu).toLocaleString('id-ID'),t.kasir,t.metode,t.subtotal,t.diskon,t.pajak,t.total,M(t.totalHPP),M(t.laba)])];
  dl(new Blob(['\ufeff'+rs.map(r=>r.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),`laporan-haswah_${d.a}_${d.b}.csv`)};
const lib=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
A.pdf=async()=>{try{
  if(!window.jspdf){await lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js')}
  const d=repData(),doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});let y=82;
  doc.setFontSize(16);doc.text(S.settings.namaUsaha||'Haswah',40,44);doc.setFontSize(11);doc.text('Laporan Keuangan - Periode '+d.a+' s/d '+d.b,40,62);
  const tb=(h,b,rt)=>{if(!b.length)return;const cs={};(rt||[]).forEach(i=>cs[i]={halign:'right'});doc.autoTable({startY:y,head:[h],body:b,theme:'grid',styles:{fontSize:9},headStyles:{fillColor:[29,99,220]},columnStyles:cs,margin:{left:40,right:40}});y=doc.lastAutoTable.finalY+18};
  tb(['Ringkasan','Nilai'],sm(d),[1]);tb(['Metode pembayaran','Transaksi','Total'],tM(d),[1,2]);tb(['Produk','Qty','Omzet','Laba'],tP(d),[1,2,3]);tb(['Bahan','Terpakai'],tB(d),[1]);
  tb(['No Order','Waktu','Kasir','Metode','Total','Laba'],d.l.map(t=>[t.noOrder,new Date(t.waktu).toLocaleString('id-ID'),t.kasir,t.metode,R(t.total),R(t.laba)]),[4,5]);
  doc.save(`laporan-haswah_${d.a}_${d.b}.pdf`)}catch(e){toast('Gagal membuat PDF. Periksa koneksi internet.')}};

const gridHtml=()=>{const isC=me&&me.role==='cust',c=isC?meCust():null,pts=c?c.poin||0:0;
  const l=S.products.filter(p=>p.aktif!==false&&(cat==='Semua'||(cat==='Tukar Poin'?p.hargaPoin>0:p.kategori===cat))&&p.nama.toLowerCase().includes(q.toLowerCase()));

    const canRed=isC&&c&&S.settings.poinAktif!==false&&p.hargaPoin>0;
    return`<div class="card"><div class="th ${p.gambar?'hi':''}" ${p.gambar?`onclick="A.imgPrev('${p.id}')" title="Ketuk untuk perbesar gambar"`:''}>${p.gambar?`<img src="${p.gambar}" alt="${esc(p.nama)}">`:ic('cup',34)}${p.hargaPoin>0?`<span class="ptag">${p.hargaPoin} Poin</span>`:''}</div><div class="b">${esc(p.nama)}</div><div class="mu">${esc(p.kategori)}</div><div class="row sp" style="margin-top:8px"><b>${R(p.hargaJual)}</b><button class="ad" onclick="A.add('${p.id}',0)" title="Tambah ke keranjang">+</button></div>${canRed?`<button class="btn s ${pts>=p.hargaPoin?'o':''} w" style="margin-top:8px" onclick="A.add('${p.id}',1)">${ic('star',13)} Tukar ${p.hargaPoin} Poin</button>`:''}</div>`}).join(''):em('Belum ada menu aktif')};
A.imgPrev=id=>{const p=pr(id);if(!p||!p.gambar)return;modal(`<div style="text-align:center"><img src="${p.gambar}" alt="${esc(p.nama)}" style="width:100%;max-height:60vh;object-fit:contain;border-radius:14px;background:#fff;border:1px solid var(--bd)"><div class="b" style="font-size:18px;margin-top:12px">${esc(p.nama)}</div><div class="mu">${esc(p.kategori)} &#183; ${R(p.hargaJual)}</div><div class="row" style="margin-top:14px"><button class="btn o" onclick="A.x()">Tutup</button><button class="btn a" style="flex:1" onclick="A.add('${p.id}',0);A.x()">+ Tambah ke Keranjang</button></div></div>`)};

const tot=()=>{const sub=cart.reduce((s,i)=>s+(i.redeem?0:i.harga)*i.qty,0),pts=cart.reduce((s,i)=>s+(i.redeem?(i.hargaPoin||0):0)*i.qty,0),dk=Math.min(disc,sub),pj=Math.round((sub-dk)*(S.settings.pajakPersen||0)/100);return{sub,dk,pj,total:sub-dk+pj,pts}};

const cartHtml=()=>`<div class="b" style="margin-bottom:6px">Keranjang</div>${cartOrder?`<div class="mu" style="margin-bottom:6px">Pesanan antrian <b>${esc(S.orders.find(o=>o.id===cartOrder)?.noAntrian||'')}</b> <button class="btn s o" onclick="A.ocl()">Lepas</button></div>`:''}${cart.length?cart.map((i,x)=>`<div class="ln row sp"><div><div class="b">${esc(i.nama)} ${i.redeem?'<span class="bd in">Tukar Poin</span>':''}</div><div class="mu">${i.redeem?i.hargaPoin+' Poin':R(i.harga)}</div></div><div class="st"><button onclick="A.qty(${x},1)">+</button><span>${i.qty}</span><button onclick="A.qty(${x},-1)">&#8722;</button></div></div>`).join(''):em('Keranjang kosong')}${!cartOrder&&S.settings.poinAktif!==false&&S.customers.length?`<label>Member Pelanggan (opsional, untuk poin)</label><select onchange="A.cmem(this.value)"><option value="">Umum / Non-member</option>${S.customers.filter(c=>c.aktif!==false).map(c=>`<option value="${esc(c.id)}" ${cartMember===c.id?'selected':''}>${esc(c.nama)} (@${esc(c.username)} &#183; ${c.poin||0} pt)</option>`).join('')}</select>`:''}<label>Diskon (Rp)</label><input type="number" min="0" value="${disc||''}" oninput="A.dsc(this.value)"><div class="tab" style="margin:10px 0">${['Tunai','QRIS','Transfer'].map(m=>`<button class="${pay===m?'on':''}" onclick="A.pay('${m}')">${m}</button>`).join('')}</div>${payBox()}${pay==='Tunai'?`<label>Uang diterima (Rp)</label><div class="row"><input id="pd_in" type="number" min="0" value="${paid||''}" oninput="A.pd(this.value)"><button type="button" class="btn o" style="white-space:nowrap;flex:none" onclick="A.pas()">Uang Pas</button></div>`:''}<div id="ct" style="margin-top:10px">${ctHtml()}</div><button class="btn a w" style="margin-top:12px" onclick="A.bayar()">Proses Bayar</button>`;

A.add=(id,red=0)=>{const p=pr(id);if(!p)return;
  if(red){const c=meCust();if(!c?.id)return toast('Masuk akun pelanggan untuk menukar poin');const used=tot().pts;if((c.poin||0)-used<p.hargaPoin)return toast('Poin Anda belum mencukupi');}
  const e=cart.find(i=>i.id===id&&!!i.redeem===!!red);if(e)e.qty++;else cart.push({id,nama:p.nama,harga:red?0:p.hargaJual,hargaPoin:p.hargaPoin||0,redeem:!!red,qty:1});

const receipt=(t,adm)=>{lastRcp=t;const w=+S.settings.lebarStruk||80,rw=(a,b,x)=>`<div class="row sp" style="gap:6px;${x||''}"><span>${a}</span><span>${b}</span></div>`,hr='<hr style="border:0;border-top:1px dashed #000;margin:6px 0">';
  modal(`<div id="rcp" style="width:${w}mm;max-width:100%;margin:0 auto;font-family:'Courier New',monospace;font-size:12px;color:#111"><div style="text-align:center;font-weight:700;font-size:15px">${esc(S.settings.namaUsaha||'Haswah')}</div><div style="text-align:center">${esc(S.settings.alamat||'')}</div>${hr}<div>No   : ${t.noOrder}</div><div>Tgl  : ${new Date(t.waktu).toLocaleString('id-ID')}</div><div>Kasir: ${esc(t.kasir)}</div>${t.memberUser?`<div>Member: @${esc(t.memberUser)}</div>`:''}${t.status==='batal'?'<div><b>** TRANSAKSI BATAL **</b></div>':''}${hr}${t.items.map(i=>`<div>${esc(i.nama)}${i.redeem?' [POIN]':''}</div>${rw('&nbsp;'+i.qty+' x '+R(i.harga),R(i.harga*i.qty))}`).join('')}${hr}${rw('Subtotal',R(t.subtotal))}${rw('Diskon','-'+R(t.diskon))}${rw('Pajak',R(t.pajak))}${rw('TOTAL',R(t.total),'font-weight:700;font-size:14px')}${rw('Bayar ('+t.metode+')',R(t.dibayar))}${t.metode==='Tunai'?rw('Kembali',R(t.kembalian)):''}${t.poinDidapat>0?rw('Poin Didapat','+'+t.poinDidapat+' Poin'):''}${hr}<div style="text-align:center">Terima kasih, sampai jumpa lagi!</div></div><div class="row noprint" style="margin-top:16px;flex-wrap:wrap"><button class="btn a" style="flex:1" onclick="A.btPrint()">${ic('bt',15)} ${btChar?'Cetak Struk BT':'Hubungkan BT'}</button>${adm&&me.role==='admin'&&t.status==='selesai'?`<button class="btn d" onclick="A.batal('${t.id}')">Batalkan</button>`:''}<button class="btn" onclick="A.x()">Tutup</button></div>`)};
A.rcp=id=>receipt(S.transactions.find(t=>t.id===id),1);

A.btConn=async()=>{if(!navigator.bluetooth)return toast('Browser ini tidak mendukung Web Bluetooth. Gunakan Chrome/Edge di Android/Desktop.');
  try{const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ff00-0000-1000-8000-00805f9b34fb']});
    const srv=await dev.gatt.connect(),svcs=await srv.getPrimaryServices();let found=null;
    for(const s of svcs){const cs=await s.getCharacteristics();for(const c of cs){if(c.properties.write||c.properties.writeWithoutResponse){found=c;break}}if(found)break}
    if(!found)throw new Error('Karakteristik tulis printer tidak ditemukan');
    btChar=found;btName=dev.name||'Printer BT';dev.addEventListener('gattserverdisconnected',()=>{btChar=null;btName='';toast('Printer Bluetooth terputus');render()});
    toast('Terhubung ke '+btName);render()}catch(e){if(e.name!=='NotFoundError')toast('Bluetooth gagal: '+(e.message||e))}};
A.btDisc=()=>{try{btChar?.service?.device?.gatt?.disconnect()}catch(e){}btChar=null;btName='';render()};
const btWrite=async bytes=>{for(let i=0;i<bytes.length;i+=20){const chunk=bytes.slice(i,i+20);if(btChar.properties.writeWithoutResponse)await btChar.writeValueWithoutResponse(chunk);else await btChar.writeValue(chunk)}};
const escPos=t=>{const w=+S.settings.lebarStruk===58?32:48,pad=(a,b)=>a+ ' '.repeat(Math.max(1,w-a.length-b.length))+b,hr='-'.repeat(w);
  const lines=['\x1B\x40\x1B\x61\x01\x1B\x45\x01'+(S.settings.namaUsaha||'Haswah')+'\x1B\x45\x00',S.settings.alamat||'','\x1B\x61\x00'+hr,'No   : '+t.noOrder,'Tgl  : '+new Date(t.waktu).toLocaleString('id-ID'),'Kasir: '+t.kasir,...(t.memberUser?['Member: @'+t.memberUser]:[]),hr,...t.items.flatMap(i=>[i.nama+(i.redeem?' [POIN]':''),pad(' '+i.qty+' x '+R(i.harga),R(i.harga*i.qty))]),hr,pad('Subtotal',R(t.subtotal)),pad('Diskon','-'+R(t.diskon)),pad('Pajak',R(t.pajak)),'\x1B\x45\x01'+pad('TOTAL',R(t.total))+'\x1B\x45\x00',pad('Bayar ('+t.metode+')',R(t.dibayar)),...(t.metode==='Tunai'?[pad('Kembali',R(t.kembalian))]:[]),...(t.poinDidapat>0?[pad('Poin Didapat','+'+t.poinDidapat+' Pt')]:[]),hr,'\x1B\x61\x01Terima kasih!\n\n\n\x1D\x56\x41\x00'];
  return new TextEncoder().encode(lines.filter(Boolean).join('\n'))};
A.btTest=async()=>{if(!btChar)return A.btConn();try{await btWrite(new TextEncoder().encode('\x1B\x40\x1B\x61\x01TES PRINTER BLUETOOTH\nHaswah\n--------------------------------\n\n\n'));toast('Tes cetak terkirim')}catch(e){toast('Gagal cetak BT: '+e.message)}};
A.btPrint=async()=>{if(!btChar){await A.btConn();if(!btChar)return}if(!lastRcp)return;try{await btWrite(escPos(lastRcp));toast('Struk tercetak ke '+btName)}catch(e){toast('Gagal cetak BT: '+e.message)}};

A.bayar=async()=>{if(!cart.length)return toast('Keranjang masih kosong');const t=tot();if(pay==='Tunai'&&paid<t.total)return toast('Uang diterima kurang dari total');
  const ord=cartOrder?S.orders.find(o=>o.id===cartOrder):null,mUser=ord?.user||cartMember||'';
  const items=cart.map(i=>({produkId:i.id,nama:i.nama,qty:i.qty,harga:i.redeem?0:i.harga,hpp:hpp(pr(i.id)),redeem:!!i.redeem,hargaPoin:i.hargaPoin||0}));
  const ptsEarned=mUser&&(!ord||!ord.poinDiberikan)?calcPts(t.sub-t.dk):0;
  const tr={items,subtotal:t.sub,diskon:t.dk,pajak:t.pj,total:t.total,totalHPP:items.reduce((s,i)=>s+i.hpp*i.qty,0),metode:pay,dibayar:pay==='Tunai'?paid:t.total,kembalian:pay==='Tunai'?paid-t.total:0,kasir:me.nama,status:'selesai',waktu:Date.now(),...(mUser?{memberUser:mUser,poinDidapat:ptsEarned}:{})};
  tr.laba=tr.total-tr.pajak-tr.totalHPP;tr.pakai=usage(tr);
  const k=tr.pakai.find(u=>ig(u.bahanId).stok<u.qty);if(k)return toast('Stok '+ig(k.bahanId).nama+' tidak cukup');

const parseNum=v=>{
  if(typeof v==='number')return isFinite(v)?v:0;
  let s=String(v??'').replace(/[Rp\s]/gi,'').trim();
  if(!s)return 0;
  if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  else if(/^\d{1,3}(,\d{3})+$/.test(s))s=s.replace(/,/g,'');
  else s=s.replace(/,/g,'.');
  return +s||0;
};

const parseCsvText=txt=>{
  txt=txt.replace(/^\ufeff/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/^sep=.\n/i,'');
  const fl=txt.split('\n').find(l=>l.trim())||'';
  const cnt=d=>(fl.match(new RegExp('\\'+d,'g'))||[]).length;
  const sep=cnt(';')>=cnt(',')&&cnt(';')>=cnt('\t')?';':cnt('\t')>cnt(',')?'\t':',';
  const out=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(q){if(ch==='"'&&txt[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}
    else{if(ch==='"')q=true;else if(ch===sep){row.push(cur.trim());cur=''}else if(ch==='\n'){row.push(cur.trim());if(row.some(x=>x!==''))out.push(row);row=[];cur=''}else cur+=ch}
  }
  row.push(cur.trim());if(row.some(x=>x!==''))out.push(row);
  return out;
};

A.impFile=async(el,t)=>{
  const f=el.files[0],pv=$('imp_prev'),bt=$('imp_btn');if(!f||!pv)return;
  pv.innerHTML='<div class="mu">Membaca file...</div>';bt.disabled=true;impData=[];
  try{
    let raw=[];
    if(/\.xlsx?$/i.test(f.name)){
      const X=await loadXlsx(),buf=await f.arrayBuffer(),wb=X.read(buf,{type:'array'}),sh=wb.Sheets[wb.SheetNames[0]];
      raw=X.utils.sheet_to_json(sh,{header:1,defval:''}).map(r=>r.map(c=>String(c??'').trim())).filter(r=>r.some(x=>x!==''));
    }else{
      raw=parseCsvText(await f.text());
    }
    if(raw.length&&/^(nama|name|produk|bahan|menu|no\b)/i.test(String(raw[0][0]||'')))raw.shift();
    const isP=t==='prod';
    if(isP){
      raw.forEach(r=>{
        const nama=String(r[0]||'').trim();if(!nama)return;
        const kategori=String(r[1]||'').trim()||'Lainnya',hargaJual=Math.max(0,parseNum(r[2]));if(!(hargaJual>0))return;
        const hargaPoin=Math.max(0,Math.round(parseNum(r[3]))),aktif=!/^(nonaktif|0|false|tidak|no)$/i.test(String(r[4]||'').trim());
        const resepRaw=String(r[5]||'').trim(),resep=[];
        if(resepRaw){
          resepRaw.split(/[|;,]/).forEach(part=>{
            const [bn,qStr]=part.split(/[:=]/).map(s=>String(s||'').trim());if(!bn)return;
            const qty=parseNum(qStr),found=S.ingredients.find(g=>g.nama.toLowerCase()===bn.toLowerCase()||g.id===bn);
            if(found&&qty>0)resep.push({bahanId:found.id,qty});
          });
        }
        impData.push({nama,kategori,hargaJual,hargaPoin,aktif,resep});
      });
    }else{
      raw.forEach(r=>{
        const nama=String(r[0]||'').trim();if(!nama)return;
        const stRaw=String(r[1]||'gr').trim().toLowerCase();
        const satuan=['ml','liter','l'].includes(stRaw)?'ml':['pcs','buah','cup','biji'].includes(stRaw)?'pcs':'gr';
        const stok=Math.max(0,parseNum(r[2])),stokMinimum=Math.max(0,parseNum(r[3])),hargaPerSatuan=Math.max(0,parseNum(r[4]));
        impData.push({nama,satuan,stok,stokMinimum,hargaPerSatuan});
      });
    }
    if(!impData.length){pv.innerHTML=`<div class="card" style="background:var(--erb);border-color:var(--er);color:var(--ert);font-size:12px">Tidak ada baris data valid ditemukan. Pastikan kolom sesuai template.</div>`;return}
    bt.disabled=false;bt.innerHTML=`${ic('upload',15)} Import ${impData.length} ${isP?'Produk':'Bahan'}`;
    pv.innerHTML=`<div class="b" style="font-size:13px;margin-bottom:6px;color:var(--ok)">Siap mengimpor ${impData.length} ${isP?'produk':'bahan'}:</div>
    <div class="ov" style="max-height:200px;border:1px solid var(--bd);border-radius:10px">${isP
      ?tbl(['Nama Produk','Kategori','Harga','Poin','Resep'],impData.slice(0,50).map(x=>[x.nama,x.kategori,R(x.hargaJual),x.hargaPoin||0,x.resep.length?x.resep.length+' bahan':'-']),[2,3])
      :tbl(['Nama Bahan','Satuan','Stok Awal','Min','Harga/Satuan'],impData.slice(0,50).map(x=>[x.nama,x.satuan,x.stok,x.stokMinimum,R(x.hargaPerSatuan)]),[2,3,4])
    }</div>`;
  }catch(e){pv.innerHTML=`<div class="card" style="background:var(--erb);border-color:var(--er);color:var(--ert);font-size:12px">Gagal membaca file: ${esc(e.message||e)}</div>`}
};

A.impRun=async t=>{
  if(!impData.length)return;
  const isP=t==='prod',upd=$('imp_upd')?$('imp_upd').checked:true,bt=$('imp_btn');
  if(bt){bt.disabled=true;bt.textContent='Menyimpan...'}
  let addN=0,updN=0,skipN=0;
  if(await run(async()=>{
    for(const item of impData){
      if(isP){
        const ex=S.products.find(p=>p.nama.toLowerCase()===item.nama.toLowerCase());
        if(ex){if(!upd){skipN++;continue}await save('products',{...item,gambar:ex.gambar||'',resep:item.resep.length?item.resep:(ex.resep||[])},ex.id);updN++}
        else{await save('products',{...item,gambar:''});addN++}
      }else{
        const ex=S.ingredients.find(g=>g.nama.toLowerCase()===item.nama.toLowerCase());
        if(ex){if(!upd){skipN++;continue}await save('ingredients',item,ex.id);updN++}
        else{await save('ingredients',item);addN++}
      }
    }
  })){
    impData=[];A.x();view();
    toast(`Import selesai: ${addN} ditambahkan${updN?`, ${updN} diperbarui`:''}${skipN?`, ${skipN} dilewati`:''}`);
  }else if(bt){bt.disabled=false;bt.textContent='Proses Import'}
};

A.pProf=async()=>{const c=meCust();if(!c)return;const nama=$('pn').value.trim(),noWa=$('pwa').value.replace(/\D/g,'');if(nama.length<2)return toast('Nama minimal 2 huruf');
  if(await run(()=>save('customers',{nama:nama.slice(0,40),noWa},c.id))){me.nama=nama.slice(0,40);me.noWa=noWa;render();toast('Profil berhasil diperbarui')}};
A.pPass=async()=>{const c=meCust();if(!c)return;const p1=$('pp1').value,p2=$('pp2').value,p3=$('pp3').value;
  if(p2.length<6)return toast('Password baru minimal 6 karakter');if(p2!==p3)return toast('Konfirmasi password baru tidak sama');
  try{const cur=IS_PREVIEW?c:(await F.getDoc(F.doc(db,'customers',c.id))).data();
    if(!cur||cur.passwordHash!==await pbk(c.id,p1))return toast('Password lama salah');
    await save('customers',{passwordHash:await pbk(c.id,p2)},c.id);$('pp1').value='';$('pp2').value='';$('pp3').value='';toast('Password berhasil diubah');
  }catch(e){toast('Gagal mengubah password: '+fe(e))}};
A.pUser=async()=>{const c=meCust();if(!c)return;const newId=$('pu1').value.trim().toLowerCase(),pw=$('pu2').value,oldId=c.id;
  if(!/^[a-z0-9._-]{3,20}$/.test(newId))return toast('Username baru 3-20 karakter (a-z, 0-9, . _ -)');
  if(newId===oldId)return toast('Username baru sama dengan yang lama');
  try{const cur=IS_PREVIEW?c:(await F.getDoc(F.doc(db,'customers',oldId))).data();
    if(!cur||cur.passwordHash!==await pbk(oldId,pw))return toast('Password konfirmasi salah');
    if(IS_PREVIEW){if(S.customers.some(x=>x.id===newId))return toast('Username sudah dipakai')}
    else if((await F.getDoc(F.doc(db,'customers',newId))).exists())return toast('Username sudah dipakai');
    const nd={...cur,username:newId,memberId:cur.memberId||oldId,passwordHash:await pbk(newId,pw)};delete nd.id;
    if(IS_PREVIEW){S.customers=[{id:newId,...nd},...S.customers.filter(x=>x.id!==oldId)]}
    else{await F.setDoc(F.doc(db,'customers',newId),nd);await F.deleteDoc(F.doc(db,'customers',oldId))}
    me.id=newId;me.memberId=nd.memberId;
    if(!IS_PREVIEW){un.forEach(f=>f());un=[];listen()}
    render();toast('Username berhasil diganti menjadi @'+newId);
  }catch(e){toast('Gagal mengganti username: '+fe(e))}};

// ===== ANTRIAN, PELANGGAN, & WHATSAPP =====
const ST={menunggu:['Menunggu','wn'],diproses:['Diproses','in'],siap:['Siap diambil','ok'],selesai:['Selesai','ok'],batal:['Batal','er']};
const act=()=>S.orders.filter(o=>['menunggu','diproses','siap'].includes(o.status)&&day(o.waktu)===today()).sort((a,b)=>a.waktu-b.waktu);
const jam=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});

async function placeOrder(o){
  if(IS_PREVIEW){const n=(pq.tgl===today()?pq.n:0)+1;pq={n,tgl:today()};o.noAntrian='A-'+String(n).padStart(3,'0');o.id=uid();S.orders.unshift(o);return o}
  let rid;await F.runTransaction(db,async tx=>{const c=F.doc(db,'counters','antrian'),sn=await tx.get(c),d=sn.exists()?sn.data():{},n=(d.tgl===today()?d.n:0)+1,r=F.doc(F.collection(db,'orders'));
    o.noAntrian='A-'+String(n).padStart(3,'0');tx.set(c,{n,tgl:today()});tx.set(r,o);rid=r.id});
  o.id=rid;return o}

const waPhone=raw=>{let n=(raw||'').replace(/\D/g,'');if(!n)return'';if(n[0]==='0')n='62'+n.slice(1);return n};
const waUrl=o=>{const n=waPhone(S.settings.waToko);if(!n)return'';
  const m=`Halo ${S.settings.namaUsaha||'Haswah'}, saya ingin konfirmasi bukti pembayaran pesanan.\nNo. Antrian: ${o.noAntrian}\nNama: ${o.nama}${o.metode?`\nPembayaran: ${o.metode} (sudah dibayar, mohon diverifikasi)`:''}\n\nPesanan:\n${o.items.map(i=>`- ${i.qty}x ${i.nama}${i.redeem?' [Tukar Poin]':` (${R(i.harga*i.qty)})`}`).join('\n')}\n\nTotal: ${R(o.total)}${o.catatan?'\nCatatan: '+o.catatan:''}`;
  return`https://wa.me/${n}?text=${encodeURIComponent(m)}`};

const custWaMsg=(o,stText)=>{const s=S.settings,tpl=s.waPesanSiap||'Halo {nama}, pesanan {noAntrian} Anda di {toko} sudah {status}! Terima kasih.{infoPoin}';
  const infoPoin=o.poinDidapat>0?` Anda mendapat +${o.poinDidapat} poin!`:'';
  return tpl.replace(/\{nama\}/g,o.nama).replace(/\{noAntrian\}/g,o.noAntrian).replace(/\{toko\}/g,s.namaUsaha||'Haswah').replace(/\{status\}/g,stText).replace(/\{infoPoin\}/g,infoPoin)};

async function sendWaAuto(o,stText){const ph=waPhone(o.noWa);if(!ph||!S.settings.waApiToken)return;
  try{const fd=new FormData();fd.append('target',ph);fd.append('message',custWaMsg(o,stText));
    await fetch('https://api.fonnte.com/send',{method:'POST',headers:{Authorization:S.settings.waApiToken},body:fd});
    toast('Notifikasi WA terkirim ke '+o.nama)}catch(e){}}

A.waSend=id=>{const o=S.orders.find(x=>x.id===id);if(!o)return;const ph=waPhone(o.noWa);if(!ph)return toast('Pelanggan belum mengisi nomor WhatsApp');
  window.open(`https://wa.me/${ph}?text=${encodeURIComponent(custWaMsg(o,ST[o.status][0]))}`,'_blank','noopener')};

const waModal=o=>{const isCash=o.metode==='Tunai',u=!isCash?waUrl(o):'';
  modal(`<div style="text-align:center"><div class="mu">Pesanan diterima! Nomor antrian Anda</div><div class="big" style="font-size:40px;margin:4px 0">${o.noAntrian}</div><div class="mu">${isCash?'Notifikasi pesanan sudah masuk otomatis ke kasir secara real-time. Silakan lakukan pembayaran tunai di kasir.':'Langkah terakhir: kirim bukti pembayaran '+esc(o.metode)+' ke WhatsApp toko agar pesanan segera diverifikasi.'}</div></div>${!isCash?(u?`<a class="btn a w" style="margin-top:14px;text-decoration:none" href="${u}" target="_blank" rel="noopener">${ic('wa',16)} Konfirmasi & Kirim Bukti via WA</a>`:'<div class="mu" style="margin:10px 0;text-align:center">Nomor WhatsApp toko belum diatur oleh Admin.</div>'):''}<button class="btn ${isCash?'a':'o'} w" style="margin-top:10px" onclick="A.go('cqueue')">Lihat Antrian</button>`)};

P.antri=()=>{const l=act(),doneToday=S.orders.filter(o=>['selesai','batal'].includes(o.status)&&day(o.waktu)===today());
  return head('Antrian Pesanan','Nomor antrian & riwayat pemesanan direset otomatis setiap hari')+(l.length?`<div class="g g3">${l.map(o=>`<div class="card"><div class="row sp"><span class="big">${o.noAntrian}</span><span class="bd ${ST[o.status][1]}">${ST[o.status][0]}</span></div><div class="b">${esc(o.nama)} ${o.user?`<span class="mu">@${esc(o.user)}</span>`:''}</div><div class="mu">${jam(o.waktu)} ${o.metode?`<span class="bd ${o.sudahBayar?'ok':'wn'}">${o.metode}${o.sudahBayar?' &#183; sudah bayar':' &#183; bayar di kasir'}</span>`:''}</div><div style="margin:8px 0">${o.items.map(i=>`<div>${i.qty}&#215; ${esc(i.nama)} ${i.redeem?'<span class="bd in">Tukar Poin</span>':''}</div>`).join('')}</div>${o.catatan?`<div class="mu" style="background:var(--sf);padding:6px 10px;border-radius:10px">${ic('note',13)} ${esc(o.catatan)}</div>`:''}<div class="row sp ln"><span class="mu">Total</span><b>${R(o.total)}</b></div><div class="row" style="flex-wrap:wrap;margin-top:6px">${o.status==='menunggu'?`<button class="btn s" onclick="A.ost('${o.id}','diproses')">Proses</button>`:''}${o.status==='diproses'?`<button class="btn s" onclick="A.ost('${o.id}','siap')">Siap</button>`:''}${o.noWa?`<button class="btn s o" onclick="A.waSend('${o.id}')" title="Kirim notif WA ke pelanggan">${ic('wa',13)} WA</button>`:''}<button class="btn s a" onclick="A.oload('${o.id}')">Bayar di Kasir</button><button class="btn s d" onclick="A.ost('${o.id}','batal')">Batal</button></div></div>`).join('')}</div>`:`<div class="card">${em('Belum ada antrian pesanan aktif hari ini')}</div>`)+(doneToday.length?`<div class="card" style="margin-top:14px"><div class="row sp" style="margin-bottom:6px"><span class="b">Riwayat Pemesanan Hari Ini (${doneToday.length})</span><span class="mu">Direset setiap hari</span></div>${doneToday.map(o=>`<div class="ln row sp"><span><b>${o.noAntrian}</b> &#183; ${esc(o.nama)} <span class="mu">(${jam(o.waktu)} &#183; ${R(o.total)})</span></span><span class="bd ${ST[o.status][1]}">${ST[o.status][0]}</span></div>`).join('')}</div>`:'')};

A.olc=()=>ask('Tutup (batalkan) semua pesanan hari sebelumnya yang belum selesai?',async()=>{for(const o of S.orders.filter(o=>['menunggu','diproses','siap'].includes(o.status)&&day(o.waktu)<today()))await save('orders',{status:'batal'},o.id);view()},'Tutup Semua');
A.ost=async(id,v)=>{const o=S.orders.find(x=>x.id===id);if(!o||o.status===v||o.status==='batal'||o.status==='selesai')return;
  await run(async()=>{
    const upd={status:v};
    if(v==='selesai'&&o.user&&!o.poinDiberikan){const pts=calcPts(o.subtotal||o.total);if(pts>0){await awardPoints(o.user,pts,o.noAntrian,'Pesanan '+o.noAntrian);upd.poinDiberikan=true;upd.poinDidapat=pts;o.poinDidapat=pts}}
    if(v==='batal'&&o.user&&o.poinDipakai>0&&!o.poinDikembalikan){await awardPoints(o.user,o.poinDipakai,o.noAntrian,'Pengembalian poin batal '+o.noAntrian);upd.poinDikembalikan=true}
    await save('orders',upd,id);
    if(v==='siap'||v==='selesai')sendWaAuto(o,ST[v][0]);
  })};
A.oload=id=>{const o=S.orders.find(x=>x.id===id);if(!o)return;const c=[];o.items.forEach(i=>{const p=pr(i.produkId);if(p&&p.aktif!==false)c.push({id:p.id,nama:p.nama,harga:i.redeem?0:p.hargaJual,hargaPoin:i.hargaPoin||0,redeem:!!i.redeem,qty:i.qty})});if(!c.length)return toast('Menu pesanan sudah tidak tersedia');cart=c;cartOrder=id;pay=o.metode||'Tunai';paid=0;disc=0;if(o.status==='menunggu')A.ost(id,'diproses');A.go('kasir')};
A.ocl=()=>{cartOrder=null;cu()};

// ===== HALAMAN PELANGGAN (MENU, KERANJANG, ANTRIAN) =====
const chips=()=>{const base=['Semua',...new Set(S.products.map(p=>p.kategori))];if(meCust()&&S.settings.poinAktif!==false&&S.products.some(p=>p.hargaPoin>0))base.push('Tukar Poin');
  return base.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${esc(c)}" onclick="A.cat(this.dataset.c)">${esc(c)}</button>`).join('')};

P.cmenu=()=>{const c=meCust();
  return head('Menu Haswah','Pilih menu favoritmu atau tukar poin')+
  (c&&S.settings.poinAktif!==false?`<div class="qa pri" style="margin-bottom:14px"><div class="row sp"><div><div class="mu">Poin Loyalty Anda</div><div class="b" style="font-size:22px">${c.poin||0} Poin</div><div class="mu">Belanja ${R(S.settings.poinNominal||10000)} = +${S.settings.poinDapat||1} poin</div></div><button class="btn s" style="background:#fff;color:#1D63DC;border:0" onclick="A.cat('Tukar Poin')">${ic('star',14)} Tukar Poin</button></div></div>`:'')+
  `<div class="srch">${ic('search',18)}<input placeholder="Cari menu..." value="${esc(q)}" oninput="A.q(this.value)"></div><div class="chips">${chips()}</div><div id="grid" class="g g2">${gridHtml()}</div>`};

P.ccart=()=>{const t=tot(),c=meCust(),estPts=c?calcPts(t.sub):0;
  return head('Keranjang Saya','Periksa pesanan sebelum dikirim')+`<div class="card" style="max-width:520px">${cart.length?cart.map((i,x)=>`<div class="ln row sp"><div><div class="b">${esc(i.nama)} ${i.redeem?'<span class="bd in">Tukar Poin</span>':''}</div><div class="mu">${i.redeem?i.hargaPoin+' Poin':R(i.harga)}</div></div><div class="st"><button onclick="A.cq(${x},1)">+</button><span>${i.qty}</span><button onclick="A.cq(${x},-1)">&#8722;</button></div></div>`).join(''):em('Keranjang masih kosong. Pilih menu dulu ya.')}<label>Catatan untuk barista (opsional)</label><input maxlength="120" placeholder="Contoh: less sugar, tanpa es" value="${esc(cnote)}" oninput="A.cn(this.value)"><div class="b" style="margin-top:14px">Pembayaran</div><div class="tab" style="margin:8px 0">${['Tunai','QRIS','Transfer'].map(m=>`<button class="${pay===m?'on':''}" onclick="A.pay('${m}')">${m}</button>`).join('')}</div>${payBox()}${pay!=='Tunai'?`<label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx);font-size:13px;margin:10px 0"><input type="checkbox" style="width:18px;height:18px;flex:none;margin-top:2px" ${cpaid?'checked':''} onchange="A.cpd(this.checked)"><span>Saya sudah menyelesaikan pembayaran ${R(t.total)} dan akan mengirim bukti lewat WhatsApp.</span></label>`:'<div class="mu" style="margin:8px 0">Bayar langsung di kasir saat mengambil pesanan (notifikasi otomatis masuk ke kasir).</div>'}<div class="row sp mu" style="margin-top:12px"><span>Subtotal</span><span>${R(t.sub)}</span></div><div class="row sp mu"><span>Pajak ${S.settings.pajakPersen||0}%</span><span>${R(t.pj)}</span></div>${t.pts?`<div class="row sp mu" style="color:var(--ac)"><span>Poin Ditukar</span><span>-${t.pts} Poin</span></div>`:''}${estPts>0?`<div class="row sp mu" style="color:var(--ok)"><span>Estimasi Poin Didapat</span><span>+${estPts} Poin</span></div>`:''}<div class="row sp b" style="font-size:18px;margin-top:4px"><span>Total</span><span>${R(t.total)}</span></div><button class="btn a w" style="margin-top:14px;padding:12px" onclick="A.corder()">Konfirmasi Pesanan</button></div>`};

A.cn=v=>{cnote=v};
A.cq=(x,d)=>{if(d>0&&cart[x].redeem){const c=meCust();if(c&&(c.poin||0)-tot().pts<cart[x].hargaPoin)return toast('Poin tidak cukup')}cart[x].qty+=d;if(cart[x].qty<=0)cart.splice(x,1);render()};

A.corder=async()=>{if(!cart.length)return toast('Keranjang masih kosong');
  const t=tot(),c=meCust();
  if(t.pts>0&&(!c||(c.poin||0)<t.pts))return toast('Saldo poin tidak mencukupi untuk penukaran');
  if(pay==='QRIS'&&!S.settings.qris)return toast('QRIS belum tersedia. Pilih metode lain.');
  if(pay==='Transfer'&&!S.settings.transfer&&!S.settings.infoTransfer)return toast('Info transfer belum tersedia. Pilih metode lain.');
  if(pay!=='Tunai'&&!cpaid)return toast('Selesaikan pembayaran, lalu centang konfirmasi pembayaran.');
  const o={nama:me.nama,catatan:cnote.trim().slice(0,120),items:cart.map(i=>({produkId:i.id,nama:i.nama,qty:i.qty,harga:i.redeem?0:i.harga,redeem:!!i.redeem,hargaPoin:i.hargaPoin||0})),subtotal:t.sub,pajak:t.pj,total:t.total,poinDipakai:t.pts,status:'menunggu',waktu:Date.now(),metode:pay,sudahBayar:pay!=='Tunai',...(c?{user:c.id,memberId:c.memberId||c.id,noWa:c.noWa||''}:{})};
  try{
    await placeOrder(o);
    if(c&&t.pts>0)await awardPoints(c.id,-t.pts,o.noAntrian,'Tukar poin pesanan '+o.noAntrian);
    notifyNewOrderPush(o);
    mine.push(o.id);cart=[];cnote='';cpaid=false;render();waModal(o);
  }catch(e){toast('Gagal mengirim pesanan: '+fe(e))}};

P.cqueue=()=>{const l=S.orders.filter(o=>day(o.waktu)===today()&&['menunggu','diproses','siap'].includes(o.status)).sort((a,b)=>a.waktu-b.waktu),td=S.orders.filter(o=>isMine(o)&&day(o.waktu)===today()),my=td.filter(o=>['menunggu','diproses','siap'].includes(o.status)),old=td.filter(o=>['selesai','batal'].includes(o.status)),steps=['menunggu','diproses','siap','selesai'];
  return head('Antrian Pesanan','Pantau status pesananmu hari ini secara real-time')+my.map(o=>{const k=steps.indexOf(o.status),live=['menunggu','diproses','siap'].includes(o.status),u=o.metode!=='Tunai'?waUrl(o):'';return`<div class="card" style="margin-bottom:12px;border-color:var(--ac)"><div class="row sp"><span class="big">${o.noAntrian}</span><span class="bd ${ST[o.status][1]}">${ST[o.status][0]}</span></div><div class="mu">${o.items.map(i=>i.qty+'&#215; '+esc(i.nama)+(i.redeem?' [Poin]':'')).join(', ')} &#183; ${R(o.total)}</div>${o.status==='batal'?'':`<div class="trk">${['Dipesan','Diproses','Siap','Selesai'].map((x,i)=>`<div class="${i<=k?'on':''}"><i></i>${x}</div>`).join('')}</div>`}${live?`<div class="mu">Antrian di depan Anda: <b>${l.filter(x=>x.waktu<o.waktu).length}</b></div>`:''}<div class="row" style="margin-top:8px">${o.status==='menunggu'?`<button class="btn s d" onclick="A.ost('${o.id}','batal')">Batalkan</button>`:''}${u?`<a class="btn s a" style="text-decoration:none" href="${u}" target="_blank" rel="noopener">${ic('wa',14)} Kirim Bukti WA</a>`:''}</div></div>`}).join('')+`<div class="card"><div class="b" style="margin-bottom:6px">Antrian Hari Ini</div>${l.length?l.map(o=>`<div class="ln row sp"><span><b>${o.noAntrian}</b> <span class="mu">${esc(o.nama.slice(0,1))}***</span>${isMine(o)?' <span class="bd ok">Anda</span>':''}</span><span class="bd ${ST[o.status][1]}">${ST[o.status][0]}</span></div>`).join(''):em('Belum ada antrian hari ini')}</div>`+`<div class="card" style="margin-top:12px"><div class="row sp" style="margin-bottom:6px"><span class="b">Riwayat Pemesanan Hari Ini</span><span class="mu">Direset setiap hari</span></div>${old.length?old.map(o=>`<div class="ln row sp"><span><b>${o.noAntrian}</b> <span class="mu">${jam(o.waktu)} &#183; ${o.items.map(i=>i.qty+'&#215; '+esc(i.nama)).join(', ')} &#183; ${R(o.total)}</span></span><span class="bd ${ST[o.status][1]}">${ST[o.status][0]}</span></div>`).join(''):em('Belum ada riwayat pemesanan selesai hari ini')}</div>`};

// ===== BOOT + PWA =====
(async()=>{
  try{
    if(IS_PREVIEW){
      S.ingredients=[{id:'i1',nama:'Biji Kopi',satuan:'gr',stok:5000,stokMinimum:1000,hargaPerSatuan:250},{id:'i2',nama:'Susu Cair',satuan:'ml',stok:800,stokMinimum:1000,hargaPerSatuan:20}];
      S.products=[{id:'p1',nama:'Cafe Latte',kategori:'Kopi',hargaJual:28000,hargaPoin:25,aktif:true,resep:[{bahanId:'i1',qty:18},{bahanId:'i2',qty:150}]},{id:'p2',nama:'Americano',kategori:'Kopi',hargaJual:20000,hargaPoin:18,aktif:true,resep:[{bahanId:'i1',qty:18}]}];
      S.users=[{id:'kasir',nama:'Kasir Demo',username:'kasir',role:'kasir',aktif:true,passwordHash:await sha('kasir'+'kasir123')}];
      S.customers=[{id:'pelanggan',nama:'Pelanggan Demo',username:'pelanggan',noWa:'081234567890',poin:30,memberId:'M-DEMO01',aktif:true,dibuat:Date.now(),passwordHash:await pbk('pelanggan','pelanggan123')}];
    }else{
      const B='https://www.gstatic.com/firebasejs/10.12.2/',[a,f,au]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
      const app=a.initializeApp(firebaseConfig);db=f.getFirestore(app);auth=au.getAuth(app);F={...f,...au,initializeApp:a.initializeApp};
      F.onAuthStateChanged(auth,u=>{if(u&&!me)enter({nama:u.email,role:'admin'});else if(!u&&me&&me.role==='admin'){un.forEach(x=>x());un=[];me=null;render()}});
    }
    render();
  }catch(e){$('root').innerHTML=`<div class="em">Gagal memuat aplikasi: ${esc(e.message)}<br>Periksa firebaseConfig dan koneksi internet.</div>`}
  try{
    await ensureSw();
    if('serviceWorker' in navigator){navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='NAV'&&e.data.page&&me&&P[e.data.page])A.go(e.data.page)})}
  }catch(e){}
})();
